# Test-only config: H2 in-memory + Hibernate-generated schema, so tests never depend on a
# running MySQL or on MySQL-flavored DDL parsing. Production schema (Flyway, db/migration) is
# validated separately against real MySQL during manual end-to-end verification.
spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

app:
  jwt:
    secret: test-only-secret-key-not-for-production-use-32-bytes-minimum
    expiration-ms: 3600000
  admin:
    username: admin
    password: Admin@123
  cors:
    allowed-origins: http://localhost:4200
