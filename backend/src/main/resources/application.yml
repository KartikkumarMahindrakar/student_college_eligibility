server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: course-eligibility-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:course_eligibility_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    # Flyway is the sole schema authority (see db/migration) - Hibernate never generates or
    # validates DDL, avoiding startup failures from type-inference mismatches (e.g. TINYINT vs
    # the INTEGER Hibernate infers for an Integer field) between hand-written SQL and entities.
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-key-please-override-in-production-32-bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.eligibility.portal: INFO
