server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same relative paths the app already calls in dev via proxy.conf.json - no
    # environment-specific branching needed in the frontend code.
    location /students/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /courses {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /subjects {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
